server:
  port: 8080

spring:
  application:
    name: adaptflow-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:adaptflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

adaptflow:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWFkYXB0Zmxvdy0yNTYtYml0cw==}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
